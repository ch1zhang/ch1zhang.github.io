cv:
  name: Chi Zhang
  label: Postdoctoral Researcher
  email: chi-zhang@mail.tsinghua.edu.cn
  location: Beijing, China
  image: ""
  summary: >
    My research focuses on defect detection in database management systems (DBMSs), with an emphasis on testing logical correctness, evaluating performance bottlenecks, and detecting privilege-security issues. I design novel testing methodologies and build supporting toolsets. Along this research direction, I have published 10 papers in CCF-A ranked journals and conferences, including 3 as first author and 1 as corresponding author. My tools and research have detected and reported over 400 previously unknown zero-day defects in Chinese DBMSs such as GaussDB, TiDB, and Dameng, as well as widely used international DBMSs including Oracle, PostgreSQL, MySQL, and SQLite3.

